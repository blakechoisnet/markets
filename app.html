<title>Rent-to-Price Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen tool. Filter strip on top, map fills the rest, city card floats right (bottom sheet on phones). */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6673;
  --line: #d9dee4;
  --accent: #1f5fae;
  --land: #e4e8ed;
  --good: #2f8f5b;
  --mid: #e0a92e;
  --bad: #c8463d;
  --out: #cbcbcb;
  --stripe-a: #7d8691;
  --stripe-b: #d6dae0;
  --shadow: 0 10px 30px rgba(20, 32, 48, .14);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --ink: #e8edf2; --muted: #9aa6b2; --line: #2c3540; --accent: #6ea8f0;
    --land: #232b35; --good: #3fae72; --mid: #e8b847; --bad: #e0635a; --out: #5a636e;
    --stripe-a: #5d6772; --stripe-b: #2e363f; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --ink: #e8edf2; --muted: #9aa6b2; --line: #2c3540; --accent: #6ea8f0;
  --land: #232b35; --good: #3fae72; --mid: #e8b847; --bad: #e0635a; --out: #5a636e;
  --stripe-a: #5d6772; --stripe-b: #2e363f; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-block: 14px 8px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -.01em; }
.titleblock { display: flex; flex-direction: column; gap: 2px; }
.asof { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

#filters { border-bottom: 1px solid var(--line); padding-block: 0 12px; }
#filters summary { cursor: pointer; font-weight: 600; font-size: 13px; padding-block: 4px; color: var(--muted); }
#filters summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 10px; align-items: end; margin-top: 6px; }
.field.wide { grid-column: span 2; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); line-height: 1.25; }
.field input[type=number], .field select {
  font: 500 13px var(--f-data); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; width: 100%; box-sizing: border-box; font-variant-numeric: tabular-nums;
}
.field input:focus-visible, .check input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field input.active, .field select.active { border-color: var(--accent); }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; padding-block: 6px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.btn {
  font: 600 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }

main { position: relative; flex: 1; min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.st { fill: var(--land); stroke: var(--surface); stroke-width: .8; cursor: pointer; transition: opacity .35s, fill .25s; vector-effect: non-scaling-stroke; }
.st:hover { filter: brightness(1.06); }
.st:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2.5; }
.zoomed .st { opacity: .22; }
.zoomed .st.sel { fill: var(--surface) !important; opacity: 1; stroke: var(--ink); stroke-width: 1.6; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); cursor: default; }
.city { stroke: var(--surface); cursor: pointer; vector-effect: non-scaling-stroke; stroke-width: 1.2; }
.tag { fill: var(--surface); stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
.clabel.intag { stroke: none; }
.leader { stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.halo { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.city:hover, .city.sel { stroke: var(--ink); stroke-width: 2.2; }
.city:focus-visible { outline: none; stroke: var(--accent); stroke-width: 3; }
.clabel { font-family: var(--f-body); font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; pointer-events: none; }

.crumb { position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 32px); }
.crumb select { font: 500 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.crumb .where { font-family: var(--f-display); font-weight: 700; font-size: 18px; }

.legend {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 32px); box-sizing: border-box;
}
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.sw.stripe { background: repeating-linear-gradient(45deg, var(--stripe-a) 0 2px, var(--stripe-b) 2px 4px); }
.legend .n { font-family: var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.grad { width: 200px; height: 8px; border-radius: 4px; position: relative; }
.gradwrap { display: flex; flex-direction: column; gap: 2px; }
.gticks { position: relative; height: 12px; width: 200px; white-space: nowrap; font: 10px var(--f-data); color: var(--muted); }
.gticks span { position: absolute; transform: translateX(-50%); }
.ltitle { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

#tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px;
  border-radius: 5px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px));
}
#tip b { font-family: var(--f-data); font-weight: 500; }

#panel {
  position: absolute; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); width: 330px; max-height: calc(100% - 20px);
  overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  box-sizing: border-box; padding: 16px 18px 14px;
}
#panel .close { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
#panel .close:hover { color: var(--ink); background: var(--bg); }
#panel h2 { font-family: var(--f-display); font-size: 24px; margin: 0 28px 0 0; line-height: 1.15; text-wrap: balance; }
#panel .rankline { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--accent); }
#panel .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.rtp { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.rtp .big { display: flex; align-items: baseline; gap: 10px; }
.rtp .val { font: 500 30px var(--f-data); font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: #fff; }
.pill.g { background: var(--good); } .pill.y { background: var(--mid); color: #1d1a10; } .pill.r { background: var(--bad); }
.pill.x { background: var(--out); color: var(--ink); } .pill.m { background: repeating-linear-gradient(45deg, var(--stripe-a) 0 4px, var(--stripe-b) 4px 8px); color: var(--ink); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.est { font-size: 10px; text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; cursor: help; }
.kv dd { margin: 0; text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.kv dd.na { font-family: var(--f-body); font-style: italic; color: var(--muted); }
.kv .fail { color: var(--bad); font-weight: 600; }
.formula { font: 11px var(--f-data); color: var(--muted); }
.sect { margin-top: 14px; }
.sect h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.why { margin-top: 10px; font-size: 12px; color: var(--bad); }
.landlord { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-weight: 500; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700; flex: none; }
.mark.ok { background: var(--good); } .mark.no { background: var(--bad); }
.src { margin-top: 12px; font-size: 11px; color: var(--muted); line-height: 1.45; }

@media (max-width: 700px) {
  h1 { font-size: 19px; }
  #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 62%; border-radius: 14px 14px 0 0;
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .legend .gradwrap { display: none; }
}
.focus { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 6px 12px; font: 600 13px var(--f-body); color: var(--ink); }
.seg input:checked + span { background: var(--ink); color: var(--surface); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.sources { flex: none; font-size: 11px; line-height: 1.5; color: var(--muted); border-top: 1px solid var(--line); padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.sources { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; }
.sources a { color: inherit; }
.sources .copy { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .st { transition: none; } }
</style>

<header class="wrap">
  <div class="titleblock">
    <h1>Rent-to-Price Map</h1>
    <div class="asof" id="asof"></div>
  </div>
  <div class="focus" role="radiogroup" aria-label="Priority">
    <span>Priority</span>
    <div class="seg">
      <label><input type="radio" name="mode" id="mode-cash" value="cash" checked><span>Cashflow</span></label>
      <label><input type="radio" name="mode" id="mode-appr" value="appr"><span>Appreciation</span></label>
    </div>
  </div>
</header>

<details id="filters" class="wrap" open>
  <summary id="fsum">Filters</summary>
  <form class="fgrid" id="fform" autocomplete="off">
    <div class="field"><label for="f-popMin">Min population</label><input type="number" id="f-popMin" step="1000" min="0" placeholder="30,000"></div>
    <div class="field"><label for="f-popMax">Max population</label><input type="number" id="f-popMax" step="1000" min="0" placeholder="Any"></div>
    <div class="field"><label for="f-rtpMin">Min RTP %</label><input type="number" id="f-rtpMin" step="0.05" min="0" placeholder="Any"></div>
    <div class="field"><label for="f-pg">Min pop. growth %</label><input type="number" id="f-pg" step="0.1" placeholder="Any"></div>
    <div class="field"><label for="f-vg">Min Property Value Growth %</label><input type="number" id="f-vg" step="0.1" placeholder="Any"></div>
    <div class="field"><label for="f-jg">Min job growth %</label><input type="number" id="f-jg" step="0.1" placeholder="Any"></div>
    <div class="field"><label for="f-ig">Min income growth %</label><input type="number" id="f-ig" step="0.1" placeholder="Any"></div>
    <div class="field"><label for="f-vac">Max vacancy %</label><input type="number" id="f-vac" step="0.1" min="0" placeholder="Any"></div>
    <div class="field"><label for="f-un">Max unemploy. %</label><input type="number" id="f-un" step="0.1" min="0" placeholder="Any"></div>
    <label class="check" for="f-bad"><input type="checkbox" id="f-bad"> Remove Anti-Landlord States</label>
    <label class="check" for="f-top"><input type="checkbox" id="f-top"> <span>Top 10 Markets</span></label>
    <label class="check" for="f-bottom"><input type="checkbox" id="f-bottom"> <span>Bottom 10 Markets</span></label>
    <button type="reset" class="btn" id="reset">Reset filters</button>
  </form>
</details>

<main id="main">
  <svg id="map" viewBox="0 0 975 610" role="img" aria-label="Map of US states colored by rent-to-price ratio">
    <defs>
      <pattern id="stripes" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
        <rect width="6" height="6" style="fill: var(--stripe-b)"></rect>
        <rect width="3" height="6" style="fill: var(--stripe-a)"></rect>
      </pattern>
    </defs>
    <g id="gStates"></g>
    <g id="gCities"></g>
    <g id="gLabels"></g>
  </svg>
  <div class="crumb">
    <button class="btn" id="back" hidden>← All states</button>
    <span class="where" id="where" hidden></span>
    <select id="jump" aria-label="Jump to a state"><option value="">Jump to state…</option></select>
  </div>
  <div class="legend" id="legend"></div>
  <div id="tip" hidden></div>
  <aside id="panel" hidden aria-live="polite"></aside>
</main>
<footer class="sources wrap"><span id="sources"></span><span class="copy">© <span id="year">2026</span> <a href="https://blakechoisnet.com" target="_blank" rel="noopener">blakechoisnet.com</a>. All rights reserved.</span></footer>

<script>
const DATA = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const FULL = [0, 0, 975, 610];
const FIELDS = [
  ["pop", "Population", (v) => fmtInt(v)],
  ["pg", "Population growth", (v) => fmtPct(v, true)],
  ["vg", "Property value growth", (v) => fmtPct(v, true)],
  ["jg", "Job growth", (v) => fmtPct(v, true)],
  ["ig", "Income growth", (v) => fmtPct(v, true)],
  ["vac", "Vacancy rate", (v) => fmtPct(v)],
  ["un", "Unemployment rate", (v) => fmtPct(v)],
];
const MIN_FILTERS = ["pg", "vg", "jg", "ig"];
const MAX_FILTERS = ["vac", "un"];
const NEEDED = ["rent", "price", "pg", "vg", "jg", "ig", "vac", "un"];
const BAD = new Set(DATA.meta.badLandlord);
const STATE = Object.fromEntries(DATA.states.map((s) => [s.a, s]));
const byState = {};
for (const c of DATA.cities) {
  c.rtp = c.rent != null && c.price ? (c.rent / c.price) * 100 : null;
  (byState[c.s] ||= []).push(c);
}
for (const k in byState) byState[k].sort((a, b) => b.pop - a.pop);

function fmtInt(v) { return v == null ? null : Math.round(v).toLocaleString("en-US"); }
function fmtPct(v, sign) { return v == null ? null : (sign && v > 0 ? "+" : "") + v.toFixed(sign ? 2 : 1) + "%"; }
function fmtMoney(v) { return v == null ? null : "$" + Math.round(v).toLocaleString("en-US"); }

// ---------- filters ----------
let F = {};
function readFilters() {
  const n = (id) => { const v = parseFloat($("#f-" + id).value); return Number.isFinite(v) ? v : null; };
  F = { popMin: n("popMin"), popMax: n("popMax"), rtpMin: n("rtpMin"), bad: !$("#f-bad").checked }; // F.bad = anti-landlord states are included
  for (const k of [...MIN_FILTERS, ...MAX_FILTERS]) F[k] = n(k);
  let active = 0;
  document.querySelectorAll(".fgrid input[type=number]").forEach((el) => {
    const on = el.value !== ""; el.classList.toggle("active", on); active += on;
  });
  if (!F.bad) active++;
  F.top = $("#f-top").checked; F.bottom = $("#f-bottom").checked;
  $("#fsum").textContent = active ? `Filters (${active} active)` : "Filters";
}

// Returns { s: 'g'|'y'|'r'|'x'|'m', fails: [field keys] }
// "Highlight markets" marks the top or bottom 10 cities by RTP (among those passing the filters) without filtering anything.
let hl = new Map(); // city -> { kind: "top" | "bottom", rank }
function computeHighlights() {
  hl = new Map();
  if (!F.top && !F.bottom) return;
  const pool = DATA.cities.filter((c) => P(c) != null && status(c).s !== "x").sort((a, b) => P(b) - P(a));
  if (F.bottom) pool.slice(-10).reverse().forEach((c, i) => hl.set(c, { kind: "bottom", rank: i + 1 }));
  if (F.top) pool.slice(0, 10).forEach((c, i) => hl.set(c, { kind: "top", rank: i + 1 }));
}
const hlName = (c) => (hl.get(c)?.kind === "top" ? `#${hl.get(c).rank} ` : "") + c.n;
function status(c) {
  const fails = [];
  if (!F.bad && BAD.has(c.s)) fails.push("bad");
  if (F.popMin != null && c.pop < F.popMin) fails.push("pop");
  if (F.popMax != null && c.pop > F.popMax) fails.push("pop");
  if (F.rtpMin != null && c.rtp != null && c.rtp < F.rtpMin) fails.push("rtp");
  for (const k of MIN_FILTERS) if (F[k] != null && c[k] != null && c[k] < F[k]) fails.push(k);
  for (const k of MAX_FILTERS) if (F[k] != null && c[k] != null && c[k] > F[k]) fails.push(k);
  if (fails.length) return { s: "x", fails };
  if (NEEDED.some((k) => c[k] == null)) return { s: "m", fails };
  return { s: tier(P(c)), fails };
}

// ---------- colors ----------
let C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["good", "mid", "bad", "out", "land"]) C[k] = cs.getPropertyValue("--" + k).trim();
}
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
// The focus picks the metric that colors dots, ranks states and drives the top/bottom 10.
// Cashflow: rent-to-price (green 1%+, yellow 0.8–1%, red below). Appreciation: 12-month home value growth (green 3%+, yellow 0–3%, red below 0).
const MODES = {
  cash: { key: "rtp", name: "Cashflow", metric: "RTP", unit: "rent ÷ price per month", hi: 1.0, lo: 0.8,
    fmt: (v) => v.toFixed(2) + "%", labels: { g: "1%+", y: "0.8–1%", r: "Below 0.8%" } },
  appr: { key: "vg", name: "Appreciation", metric: "value growth", unit: "home value change, last 12 months", hi: 3, lo: 0,
    fmt: (v) => (v > 0 ? "+" : "") + v.toFixed(2) + "%", labels: { g: "3%+", y: "0–3%", r: "Below 0%" } },
};
let MODE = MODES.cash;
const P = (c) => c[MODE.key];
const tier = (v) => (v >= MODE.hi ? "g" : v >= MODE.lo ? "y" : "r");
// p is a state's percentile (0 = lowest median RTP, 1 = highest): red → yellow → green.
function rankColor(p) {
  return p < 0.5 ? mix(C.bad, C.mid, p * 2) : mix(C.mid, C.good, (p - 0.5) * 2);
}
const cityFill = (s) => ({ g: C.good, y: C.mid, r: C.bad, x: C.out, m: "url(#stripes)" })[s];
function median(a) { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

// ---------- map ----------
const svg = $("#map"), gS = $("#gStates"), gC = $("#gCities"), gL = $("#gLabels");
const statePaths = {};
for (const s of DATA.states) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", s.d); p.setAttribute("class", "st"); p.setAttribute("tabindex", "0");
  p.setAttribute("role", "button"); p.setAttribute("aria-label", s.n);
  p.addEventListener("click", () => (cur ? zoomOut() : zoomTo(s.a))); // when zoomed in, any click off a city returns to the US view
  p.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); zoomTo(s.a); } });
  p.addEventListener("pointermove", (e) => { if (!cur) showTip(e, stateTip(s.a)); });
  p.addEventListener("pointerleave", hideTip);
  gS.appendChild(p); statePaths[s.a] = p;
  const o = document.createElement("option"); o.value = s.a; o.textContent = s.n; $("#jump").appendChild(o);
}
[...$("#jump").options].slice(1).sort((a, b) => a.text.localeCompare(b.text)).forEach((o) => $("#jump").appendChild(o));

const stateInfo = {};
// State colors. Cashflow: each state's best (highest) city RTP, ranked red → green against the other states.
// Appreciation: each state's median city value growth on a fixed scale — red below 0%, yellow at 0%, green above.
function computeStates() {

    const list = byState[s.a] || [];
    const rated = list.filter((c) => "gyr".includes(status(c).s));

    if (val == null) statePaths[s.a].style.fill = C.out;
  }
  const ranked = Object.keys(stateInfo).filter((a) => stateInfo[a].val != null).sort((a, b) => stateInfo[a].val - stateInfo[b].val);
  stateRange = ranked.length ? [stateInfo[ranked[0]].val, stateInfo[ranked[ranked.length - 1]].val] : null;
  ranked.forEach((a, i) => {
    const p = ranked.length > 1 ? i / (ranked.length - 1) : 1;

}
// Red for the most negative state, yellow at exactly 0%, green for the most positive; linear in between on each side.
function growthColor(v) {

let stateRange = null;

  if (!i.total) return `<span>${s.n}</span> · no cities ≥ 30k`;
  if (i.val == null) return `${s.n} · no qualifying cities`;
  return MODE === MODES.cash
    ? `${s.n} · highest RTP <b>${MODE.fmt(i.val)}</b> (${i.best.n}) · ${ordinal(Math.round(i.pct * 100))} percentile`

let cur = null, vb = FULL.slice(), selCity = null;
function pxScale() { const r = svg.getBoundingClientRect(); return Math.min(r.width / vb[2], r.height / vb[3]) || 1; }
function setVB(v) { vb = v; svg.setAttribute("viewBox", v.join(" ")); }
function animateVB(target, done) {

function stateBox(a) {

  const r = svg.getBoundingClientRect(), W = r.width || 975, H = r.height || 610;
  const top = 56, bottom = W > 700 ? 20 : 90, right = W > 700 ? 360 : 16, left = 16;

function drawCities() {

  const isHl = (c) => hl.has(c);
  if (!cur && !hl.size) return;
  const k = pxScale();
  let list = cur ? byState[cur] || [] : DATA.cities.filter(isHl);
  list = [...list.filter((c) => !isHl(c)), ...list.filter(isHl)]; // highlighted dots on top
  const radius = (c) => cur ? Math.max(4.5, Math.min(16, Math.sqrt(c.pop) / 45)) : Math.max(3.5, Math.min(9, Math.sqrt(c.pop) / 90));
  const pat = $("#stripes"); pat.setAttribute("width", 6 / k); pat.setAttribute("height", 6 / k);
  pat.children[0].setAttribute("width", 6 / k); pat.children[0].setAttribute("height", 6 / k);
  pat.children[1].setAttribute("width", 3 / k); pat.children[1].setAttribute("height", 6 / k);
  for (const c of list) {
    const st = status(c), rpx = radius(c);
    if (isHl(c)) {
      const h = document.createElementNS(NS, "circle");
      h.setAttribute("cx", c.x); h.setAttribute("cy", c.y); h.setAttribute("r", (rpx + 3.5) / k); h.setAttribute("class", "halo");

    el.setAttribute("class", "city" + (selCity === c ? " sel" : "")); el.style.fill = cityFill(st.s);
    el.setAttribute("tabindex", "0"); el.setAttribute("role", "button"); el.setAttribute("aria-label", `${c.n}, ${c.s}`);
    el.addEventListener("click", (e) => { e.stopPropagation(); openCity(c); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCity(c); } });
    el.addEventListener("pointermove", (e) => showTip(e, `${hlName(c)}${cur ? "" : ", " + c.s} · ${P(c) != null ? `${MODE.metric} <b>${MODE.fmt(P(c))}</b>` : MODE.metric + " n/a"}`));
    el.addEventListener("pointerleave", hideTip);

  // Labels. With highlights on, every highlighted city gets a label: each tries spots right/left of its dot,

  // Work in screen pixels, then convert back to map units.

      .forEach((c) => addLabel(c, hlName(c), true));
  } else {
    for (const c of [...list].sort((a, b) => b.pop - a.pop)) {

  }
}

// ---------- legend ----------
